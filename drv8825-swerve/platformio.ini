[platformio]
default_envs = uno_side1

[env:uno_side1]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = 
    -D BOARD_UNO_SIDE1
    -O2

[env:bluepill_side2]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
monitor_speed = 115200
build_flags = 
    -D BOARD_BLUEPILL_SIDE2
    -D SERIAL_UART_INSTANCE=1
    -O2

[env:bluepill_side1]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
monitor_speed = 115200
build_flags = 
    -D BOARD_BLUEPILL_SIDE1
    -D SERIAL_UART_INSTANCE=1
    -O2

